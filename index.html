<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MeinNetflix Dashboard</title>
  <style>
    body { background: #141414; color: white; font-family: Arial, sans-serif; margin: 0; }
    header { background: #000; padding: 15px 40px; display: flex; align-items: center; gap: 40px; }
    .logo { color: #E50914; font-size: 24px; font-weight: bold; }
    .menu { color: #aaa; font-size: 14px; }
    .menu span { margin-right: 20px; cursor: pointer; }
    .menu .active { color: white; border-bottom: 2px solid #E50914; padding-bottom: 3px; }
    
    h2 { padding: 20px 40px 10px 40px; font-size: 20px; }
    .reihe { display: flex; gap: 8px; padding: 0 40px 20px 40px; overflow-x: auto; }
    .reihe::-webkit-scrollbar { height: 8px; }
    .reihe::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    
    .kachel { min-width: 220px; height: 320px; background: #222; border-radius: 4px; position: relative; transition: all 0.3s; cursor: pointer; }
    .kachel:hover { transform: scale(1.1); z-index: 10; }
    .kachel img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    .kachel .info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, black); padding: 10px; opacity: 0; transition: 0.3s; }
    .kachel:hover .info { opacity: 1; }
    .kachel .info button { background: white; color: black; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    
    .featured { grid-column: span 2; min-width: 400px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">MEINFLIX</div>
    <div class="menu">
      <span class="active">DASHBOARD</span>
      <span>SERIEN</span>
      <span>FILME</span>
    </div>
  </header>

  <h2>ANGESAGTE SERIEN</h2>
