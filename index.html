<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MeinNetflix - Klassiker</title>
  <style>
    body { background: #141414; color: white; font-family: Arial, sans-serif; margin: 0; }
    header { background: #000; padding: 20px 40px; font-size: 28px; font-weight: bold; color: #E50914; }
    h2 { padding: 20px 40px 10px 40px; }
    .reihe { display: flex; gap: 15px; padding: 0 40px 20px 40px; overflow-x: auto; }
    .film { min-width: 220px; cursor: pointer; transition: transform 0.2s; }
    .film:hover { transform: scale(1.05); }
    .film img { width: 100%; height: 300px; object-fit: cover; border-radius: 5px; }
    #playerBox { display: none; padding: 20px 40px; }
    #playerBox video { width: 100%; max-width: 1000px; background: black; }
    #close { font-size: 30px; cursor: pointer; color: #E50914; float: right; }
  </style>
</head>
<body>
  <header>MeinNetflix - Public Domain</header>

  <h2>Kostenlose Klassiker die laufen</h2>
  <div class="reihe">
    <div class="film" onclick="play('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 'Big Buck Bunny')">
      <img src="https://picsum.photos/220/300?1"><p>Big Buck Bunny</p>
    </div>
    <div class="film" onclick="play('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', 'Elephants Dream')">
      <img src="https://picsum.photos/220/300?2"><p>Elephants Dream</p>
    </div>
    <div class="film" onclick="play('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', 'Sintel')">
      <img src="https://picsum.photos/220/300?3"><p>Sintel</p>
    </div>
  </div>

  <div id="playerBox">
    <span id="close" onclick="closePlayer()">× Schließen</span>
    <h2 id="titel"></h2>
    <video id="player" controls autoplay></video>
  </div>

  <script>
    function play(url, name) {
      document.getElementById('titel').innerText = name;
      document.getElementById('playerBox').style.display = 'block';
      document.getElementById('player').src = url;
      document.getElementById('player').scrollIntoView();
    }
    function closePlayer() {
      document.getElementById('playerBox').style.display = 'none';
      document.getElementById('player').pause();
      document.getElementById('player').src = '';
    }
  </script>
</body>
</html>
