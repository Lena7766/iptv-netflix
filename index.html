<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MeinNetflix - IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { background: #141414; color: white; font-family: Arial, sans-serif; margin: 0; }
    header { background: #000; padding: 20px; font-size: 28px; font-weight: bold; color: #E50914; }
    h2 { padding: 20px 20px 10px 20px; }
    .reihe { display: flex; gap: 10px; padding: 0 20px 20px 20px; overflow-x: auto; }
    .sender { min-width: 180px; height: 120px; background: #222; border-radius: 5px; text-align: center; cursor: pointer; padding: 10px; }
    .sender:hover { background: #E50914; }
    #player { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; }
    #player video { width: 80%; height: 80%; margin: 5% 10%; background: black; }
    #close { position: absolute; top: 20px; right: 40px; font-size: 40px; cursor: pointer; color: white; }
  </style>
</head>
<body>
  <header>MeinNetflix - Live TV</header>

  <h2>Deutsche Sender</h2>
  <div class="reihe">
    <div class="sender" onclick="playStream('https://iptv.org/playlist.m3u8')">
      <p>ARD</p>
    </div>
    <div class="sender" onclick="playStream('https://iptv.org/playlist.m3u8')">
      <p>ZDF</p>
    </div>
    <div class="sender" onclick="playStream('https://iptv.org/playlist.m3u8')">
      <p>RTL</p>
    </div>
  </div>

  <div id="player">
    <span id="close" onclick="closeVideo()">×</span>
    <video id="video" controls></video>
  </div>

  <script>
    function playStream(url) {
      document.getElementById('player').style.display = 'block';
      var video = document.getElementById('video');
      if(Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED,function() { video.play(); });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }
    function closeVideo() {
      document.getElementById('player').style.display = 'none';
      document.getElementById('video').pause();
      document.getElementById('video').src = '';
    }
  </script>
</body>
</html>
