<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MeinNetflix</title>
  <style>
    body { background: #141414; color: white; font-family: Arial, sans-serif; margin: 0; }
    header { background: #000; padding: 20px 40px; font-size: 28px; font-weight: bold; color: #E50914; }
    h2 { padding: 20px 40px 10px 40px; }
    .reihe { display: flex; gap: 15px; padding: 0 40px 20px 40px; overflow-x: auto; }
    .film { min-width: 220px; cursor: pointer; }
    .film img { width: 100%; height: 280px; object-fit: cover; border-radius: 5px; }
    .film p { text-align: center; margin: 5px 0; }
    video { width: 90%; max-width: 1000px; margin: 20px 40px; background: black; border-radius: 5px; }
  </style>
</head>
<body>
  <header>MeinNetflix</header>

  <h2>Kostenlose Filme</h2>
  <div class="reihe">
    <div class="film" onclick="document.getElementById('v').src='https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'; document.getElementById('v').play();">
      <img src="https://picsum.photos/220/280?1"><p>Big Buck Bunny</p>
    </div>
    <div class="film" onclick="document.getElementById('v').src='https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'; document.getElementById('v').play();">
      <img src="https://picsum.photos/220/280?2"><p>Elephants Dream</p>
    </div>
    <div class="film" onclick="document.getElementById('v').src='https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'; document.getElementById('v').play();">
      <img src="https://picsum.photos/220/280?3"><p>Sintel</p>
    </div>
  </div>

  <video id="v" controls></video>

</body>
</html>
