<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MeinNetflix</title>
  <style>
    body { background: #141414; color: white; font-family: Arial, sans-serif; margin: 0; }
    header { background: #000; padding: 20px; font-size: 28px; font-weight: bold; color: #E50914; }
    h2 { padding: 20px 20px 10px 20px; }
    .reihe { display: flex; gap: 10px; padding: 0 20px 20px 20px; overflow-x: auto; }
    .film { min-width: 200px; height: 300px; background: #222; border-radius: 5px; text-align: center; transition: transform 0.2s; }
    .film:hover { transform: scale(1.1); }
    .film img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px 5px 0 0; }
    .film p { margin: 5px 0; }
  </style>
</head>
<body>
  <header>MeinNetflix</header>
  <h2>Beliebte Filme</h2>
  <div class="reihe">
    <div class="film"><img src="https://image.tmdb.org/t/p/w500/qmDpIHrmpJINaRKAfWQfftjCdyi.jpg"><p>Avatar</p></div>
    <div class="film"><img src="https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg"><p>Avengers</p></div>
    <div class="film"><img src="https://image.tmdb.org/t/p/w500/rAiYTfKGqDCRIIqo664sY9XZIvQ.jpg"><p>Spider-Man</p></div>
  </div>
  <h2>Deutsche Filme</h2>
  <div class="reihe">
    <div class="film"><img src="https://image.tmdb.org/t/p/w500/wWba3TaojhK7NdycRhoQpsG0FaH.jpg"><p>Das Boot</p></div>
    <div class="film"><img src="https://image.tmdb.org/t/p/w500/aQvJ5WPzZgYVDrxLX4RwKZ1h0bV.jpg"><p>Fack ju Göhte</p></div>
  </div>
</body>
</html>
