  <style>
    body { background: #141414; color: white; font-family: Arial, sans-serif; margin: 0; }
    header { background: #000; padding: 20px; font-size: 28px; font-weight: bold; color: #E50914; }
    h2 { padding: 20px 20px 10px 20px; }
    .reihe { display: flex; gap: 10px; padding: 0 20px 20px 20px; overflow-x: auto; }
    .film { min-width: 200px; height: 300px; background: #222; border-radius: 5px; text-align: center; cursor: pointer; transition: transform 0.2s; }
    .film:hover { transform: scale(1.05); }
    .film img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px 5px 0 0; }
    .film p { margin: 5px 0; font-size: 14px; }
    #player { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; }
    #player video { width: 80%; height: 80%; margin: 5% 10%; }
    #close { position: absolute; top: 20px; right: 40px; font-size: 40px; cursor: pointer; color: white; }
  </style>
</head>
